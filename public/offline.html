<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b11" />
    <title>لا يوجد اتصال — إدارة العمليات</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #080b11;
        color: #e8edf4;
        font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', system-ui, 'Segoe UI',
          Tahoma, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        text-align: center;
        border: 1px solid rgba(35, 44, 59, 0.8);
        background: rgba(13, 17, 23, 0.85);
        border-radius: 14px;
        padding: 28px 22px;
      }
      .mark {
        width: 46px;
        height: 46px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid rgba(217, 119, 6, 0.5);
        background: rgba(217, 119, 6, 0.12);
        color: #fbbf24;
        font-size: 22px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.7; color: #94a3b8; margin: 0 0 18px; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        min-height: 46px;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: #059669;
        color: #fff;
        cursor: pointer;
      }
      button:active { background: #047857; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark" aria-hidden="true">!</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        هذه الصفحة تحتاج اتصالاً لعرض آخر البيانات. الصفحات التي فتحتها سابقاً تبقى
        متاحة، وبمجرد رجوع الشبكة سيعمل كل شيء كالمعتاد.
      </p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
    <script>
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
